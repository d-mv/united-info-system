<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>United InfoSystem (UIS)</title>
<link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/core/theme.css">
<style>
  /* Critical CSS inlined for fast first paint. Full tokens live in core/theme.css. */
  :root {
    --font-sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --color-canvas: #edeae1;
    --color-ink: #1c1b18;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-canvas: #171613;
      --color-ink: #e9e5da;
    }
  }
  html {
    font-size: 62.5%;
    font-family: var(--font-sans);
  }
  body {
    margin: 0;
    background: var(--color-canvas);
    color: var(--color-ink);
    font-family: var(--font-sans);
  }
</style>
</head>
<body>

  <div id="shell"></div>

  <script type="module">
    import { configManager } from '/core/config.js';
    import { GridEngine } from '/core/grid.js';
    import { setupExpandController } from '/core/expand.js';

    document.addEventListener('DOMContentLoaded', async () => {
      setupExpandController();
      const engine = new GridEngine();
      await engine.init();
    });
  </script>

</body>
</html>
