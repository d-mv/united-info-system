<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>United InfoSystem (UIS)</title>
<link rel="stylesheet" href="/core/theme.css">
<style>
  /* Critical CSS inlined for fast first paint */
  :root {
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --font-mono: 'Victor Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --font-body: var(--font-sans);
    --color-bg: #F3F2EE;
    --color-text: #1A1A18;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #181715;
      --color-text: #EDEBE4;
    }
  }
  html {
    font-size: 62.5%;
    font-family: var(--font-sans);
  }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
  }
  button, input, select, textarea {
    font-family: var(--font-sans);
  }
  widget-clock, .widget-clock, #clock-time, #clock-text {
    font-family: var(--font-mono);
  }
</style>
</head>
<body>

  <div id="shell"></div>

  <script type="module">
    import { configManager } from '/core/config.js';
    import { GridEngine } from '/core/grid.js';
    import { setupExpandController } from '/core/expand.js';

    document.addEventListener('DOMContentLoaded', async () => {
      setupExpandController();
      const engine = new GridEngine();
      await engine.init();
    });
  </script>

</body>
</html>
