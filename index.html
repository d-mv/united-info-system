<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>United InfoSystem (UIS)</title>
<link rel="preload" href="/fonts/space-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/core/theme.css">
<style>
  /* Critical CSS inlined for fast first paint. Full tokens live in core/theme.css. */
  /* Light/dark follows color-scheme: the OS (prefers-color-scheme: dark) unless
     Settings picked one; the script below sets data-theme before first paint. */
  :root {
    color-scheme: light dark;
    --font-sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --color-canvas: light-dark(#edeae1, #171613);
    --color-ink: light-dark(#1c1b18, #e9e5da);
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  html {
    font-size: 62.5%;
    font-family: var(--font-sans);
  }
  body {
    margin: 0;
    background: var(--color-canvas);
    color: var(--color-ink);
    font-family: var(--font-sans);
  }
</style>
<script>
  // Apply the saved theme and accent before anything paints (no flash).
  try {
    var appearance = (JSON.parse(localStorage.getItem('dashboard:config')) || {}).appearance || {};
    if (appearance.theme === 'light' || appearance.theme === 'dark') document.documentElement.dataset.theme = appearance.theme;
    if (/^(orange|green|blue|graphite)$/.test(appearance.accent || '')) document.documentElement.dataset.accent = appearance.accent;
  } catch (e) {}
</script>
</head>
<body>

  <div id="frame">
    <shell-bar class="shell-bar"></shell-bar>
    <div id="shell"></div>
  </div>
  <command-palette></command-palette>

  <script type="module">
    import { configManager } from '/core/config.js';
    import { GridEngine } from '/core/grid.js';
    import { setupExpandController } from '/core/expand.js';
    import { setupLayoutEditor } from '/core/layout-editor.js';
    import { setupAppearance } from '/core/appearance.js';
    import '/core/shell-bar.js';
    import '/core/palette.js';

    document.addEventListener('DOMContentLoaded', async () => {
      setupExpandController();
      setupLayoutEditor();
      setupAppearance();
      const engine = new GridEngine();
      await engine.init();
    });
  </script>

</body>
</html>
